name: Build & Deploy Dashboard

# 채용 파이프라인을 주기 실행해 data/dashboard.json 을 새로 만들고,
# 대시보드를 GitHub Pages 로 라이브 배포한다.
#
# ⚠️  schedule(cron) 트리거는 GitHub 정책상 "기본 브랜치(main)"에서만 발동한다.
#     따라서 이 자동화를 켜려면 이 브랜치를 main 에 머지해야 한다.
#     (workflow_dispatch 수동 실행과 main push 는 즉시 동작)

on:
  schedule:
    - cron: "0 9,21 * * *"     # 매일 06:00 / 18:00 KST (UTC 09:00 / 21:00)
  workflow_dispatch:            # Actions 탭에서 "Run workflow" 수동 실행
  push:
    branches: [main]
    paths:
      - "dashboard.html"
      - "job_pipeline/**"
      - "data/instagram.json"
      - "vendor/**"
      - "data/ga4_daily.json"       # 추가
      - "data/ga4_weekly.json"      # 추가
      - "data/ga4_brief.json"       # 추가
      - "scripts/**"                # 추가
      - ".github/workflows/deploy.yml"

# Pages 배포에 필요한 권한
permissions:
  contents: write      # read 에서 변경 — GA4 결과를 커밋해야 함
  pages: write
  id-token: write

# 배포는 취소하지 않고 순차 처리
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r job_pipeline/requirements.txt

      # 실행 간 수집 스토어를 유지 → 주간 증가폭(momentum) 시그널 누적
      - name: 스토어 캐시 복원/저장
        uses: actions/cache@v4
        with:
          path: job_pipeline/data
          key: jobstore-${{ github.run_id }}
          restore-keys: |
            jobstore-

      - name: 수집 + 스코어링 + export
        env:
          # 기본값 ksoc(대한체육회, 공개 게시판·키 불필요)로 실데이터 수집.
          # 사람인 키 발급 후: Settings > Variables 에 JOB_SOURCES=saramin,ksoc (필요시 ,worknet)
          JOB_SOURCES: ${{ vars.JOB_SOURCES || 'ksoc' }}
          JOB_KEYWORDS: ${{ vars.JOB_KEYWORDS || '스포츠,피트니스,골프,구단,스포츠마케팅' }}
          SARAMIN_ACCESS_KEY: ${{ secrets.SARAMIN_ACCESS_KEY }}
          WORKNET_AUTH_KEY: ${{ secrets.WORKNET_AUTH_KEY }}
        run: PYTHONPATH=job_pipeline python -m pipeline.cli run

      - name: GA4 의존성 설치
        run: pip install -r requirements.txt

      - name: GA4 지표 수집
        id: ga4
        continue-on-error: true
        env:
          GA4_SA_KEY: ${{ secrets.GA4_SA_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: |
          python scripts/collect_ga4.py
          python scripts/build_weekly.py
          python scripts/build_brief.py

      - name: 인스타그램 수집 (pwsh)
        id: instagram
        continue-on-error: true
        shell: pwsh
        env:
          IG_CI: '1'
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          IG_TOKEN_EXPIRES_AT: ${{ vars.IG_TOKEN_EXPIRES_AT }}
        run: |
          ./instagram-insights-connector/daily-instagram-brief.ps1

      - name: 인스타그램 결과 확인
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'data/instagram.json') {
            $d = Get-Content 'data/instagram.json' -Raw | ConvertFrom-Json
            Write-Host "generatedAt : $($d.generatedAt)"
            Write-Host "followers   : $($d.account.followersCount)"
            Write-Host "media       : $($d.media.Count)건"
          } else {
            Write-Host "::warning::data/instagram.json 이 없습니다."
          }

      - name: 인스타그램 실패 경고
        if: steps.instagram.outcome == 'failure'
        run: echo "::warning::인스타그램 수집 실패 — 토큰 만료 또는 권한 문제일 수 있습니다."

      - name: GA4 결과 커밋
        if: steps.ga4.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ga4_daily.json data/ga4_weekly.json data/ga4_brief.json data/instagram.json data/ig-brief-state.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(data): GA4 metrics $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: GA4 실패 경고
        if: steps.ga4.outcome == 'failure'
        run: echo "::warning::GA4 수집 실패 — Secrets 와 서비스계정 뷰어 권한을 확인하세요."

      - name: 정적 사이트 구성 (_site)
        run: |
          mkdir -p _site/data
          cp dashboard.html _site/index.html
          cp data/dashboard.json _site/data/dashboard.json
          # instagram.json은 Windows 로컬 커넥터(collect-instagram-insights.ps1)가 생성해
          # 커밋한 경우에만 존재한다 (토큰/시크릿은 포함되지 않는 수치 데이터).
          if [ -f data/instagram.json ]; then cp data/instagram.json _site/data/instagram.json; fi
          # 외부 CDN(cdnjs.cloudflare.com) 차단 환경에서도 차트가 항상 뜨도록,
          # Chart.js를 저장소에 커밋해 둔 로컬 파일로 함께 배포한다.
          cp -r vendor _site/vendor
          [ -f data/ga4_daily.json ]  && cp data/ga4_daily.json  _site/data/ || true
          [ -f data/ga4_weekly.json ] && cp data/ga4_weekly.json _site/data/ || true
          [ -f data/ga4_brief.json ] && cp data/ga4_brief.json _site/data/ || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
