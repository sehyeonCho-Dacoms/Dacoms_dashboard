name: G3 자동 선택 → 체인 DB 행 (웅서 인계, 준칙 v2)

# 준칙 v2 (11/8 세현 결정): 평일만. 월·수·금 의료 뉴스 / 화·목 채용·의사 일 트랙의 1등 후보로
# '블로그 GEO 체인' DB에 N 행 1개(티스토리판 포함, 상태 근거수집, 담당 웅서)를 만들고 후보에 '선택'·'체인 글 번호'를 적는다.
# 주말에는 아무것도 만들지 않고 조용히 끝난다.
# 평소에는 G0 이슈 트래커 작업 끝에서 돈다. 이 작업은 그게 실패했을 때의 안전망 + 수동 실행용.
# 그날 이미 넘긴 후보가 있으면 건너뛴다(여러 번 돌아도 안전). 미리 '선택'을 체크한 후보가 있으면 그걸 쓴다.
#
# Secrets: NOTION_TOKEN (두 DB 모두 통합 연결 필요)
# ⚠️ schedule 은 기본 브랜치(main)에서만 발동하고, 예약 시각보다 늦게 돌 수 있다. 급하면 Run workflow.

on:
  schedule:
    # 안전망 (D-055): 예약이 4~8시간 늦고 하루 1번만 돌기도 해서(16:37·18:37 → 실제 22~02시)
    # 세 번 걸어 둔다. 어느 하나라도 웅서 님 18:45 시작 전에 돌게 하려는 것. G0보다 먼저 돌면 '후보가 아직 없음'으로 조용히 끝난다.
    - cron: "37 23,2,5 * * *"  # 매일 08:37·11:37·14:37 KST → 실제 13~21시 예상
  workflow_dispatch:
    inputs:
      day:
        description: "(선택) 후보 날짜 YYYY-MM-DD. 비우면 오늘"
        required: false
        default: ""
      dry_run:
        description: "노션에 쓰지 않고 만들 행만 보기"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  g3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: G1-Q 질문 검수 미리 보기 (dry-run 일 때만, D-056)
        if: github.event.inputs.dry_run == 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NAVER_API_MODE: ${{ vars.NAVER_API_MODE || 'hub' }}
          NAVER_NEWS_ENDPOINT: ${{ vars.NAVER_NEWS_ENDPOINT }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          PYTHONPATH=geo_pipeline python -m pipeline.cli g1q --dry-run | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 그날 트랙 1등 후보 → 체인 DB N 행
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DAY: ${{ github.event.inputs.day }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          set -o pipefail
          args=()
          if [ -n "$DAY" ]; then
            [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::날짜 형식은 YYYY-MM-DD"; exit 1; }
            args+=(--day "$DAY")
          fi
          [ "$DRY" = "true" ] && args+=(--dry-run)
          PYTHONPATH=geo_pipeline python -m pipeline.cli g3 "${args[@]}" | tee g3_log.txt
          cat g3_log.txt >> "$GITHUB_STEP_SUMMARY"
          ! grep -q "❌" g3_log.txt

      - name: 슬랙 알림 (⛔·⏸ 줄만, 문제 없으면 조용히, D-046)
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          PYTHONPATH=geo_pipeline python -m pipeline.cli notify --log g3_log.txt             --title "GEO 체인 G3 안전망" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
