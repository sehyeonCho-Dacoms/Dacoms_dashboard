name: 블로그 사진 찾기 (CC0)

# 노션 '블로그 GEO 체인' DB에서 게시 전이고 사진이 없는 원고 행을 찾아, 제목·대상 질문에 맞는
# 검색어를 자동으로 만들고 Wikimedia Commons 의 CC0·퍼블릭 도메인 사진 후보 3장을 행에 붙인다.
# 검색어를 입력할 필요 없음. 작업 환경 IP가 Wikimedia 검색 API에서 막혀(429) GitHub 서버에서 돌린다.
#
# Secrets: NOTION_TOKEN
# ⚠️ schedule 은 기본 브랜치(main)에서만 발동한다.

on:
  schedule:
    - cron: "30 1 * * *"       # 매일 10:30 KST (G0 이슈 트래커 30분 뒤)
  workflow_dispatch:
    inputs:
      queries:
        description: "(선택) 직접 찾아볼 영어 검색어, 쉼표 구분. 비우면 노션 원고 행에 자동으로 붙임"
        required: false
        default: ""
      replace:
        description: "이미 붙은 사진 후보를 지우고 다시 찾기"
        type: boolean
        default: false
      dry_run:
        description: "노션에 쓰지 않고 결과만 보기"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 노션 원고 행에 사진 후보 붙이기
        if: ${{ !inputs.queries }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          FLAGS=()
          [ "${{ inputs.replace }}" = "true" ] && FLAGS+=(--replace)
          [ "${{ inputs.dry_run }}" = "true" ] && FLAGS+=(--dry-run)
          PYTHONPATH=geo_pipeline python -m pipeline.cli photo-sync "${FLAGS[@]}" | tee result.md
          { echo "## 📷 사진 후보 자동 첨부"; cat result.md; } >> "$GITHUB_STEP_SUMMARY"
          ! grep -q "❌" result.md
      - name: 검색어로 직접 찾기
        if: ${{ inputs.queries }}
        env:
          QUERIES: ${{ inputs.queries }}
        run: |
          IFS=',' read -ra QS <<< "$QUERIES"
          ARGS=()
          for q in "${QS[@]}"; do q="$(echo "$q" | xargs)"; [ -n "$q" ] && ARGS+=("$q"); done
          PYTHONPATH=geo_pipeline python -m pipeline.cli photo "${ARGS[@]}" | tee result.md
          cat result.md >> "$GITHUB_STEP_SUMMARY"
