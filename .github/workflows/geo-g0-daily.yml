name: G0 이슈 트래커 (매일)

# 블로그 GEO 체인 G0 (DR-MKT-01). 매일 아침 의료 기사를 최대 100건 모아 1차 거름망을
# 적용하고, 통과 기사는 노션 'G0 이슈 트래커 (매일 의료 기사)' DB에, 전체는 아티팩트(CSV·JSON·요약 MD)로
# 올린다. 산출물은 커밋하지 않는다.
#
# Secrets: NAVER_CLIENT_ID, NAVER_CLIENT_SECRET (G-R과 같은 NAVER API HUB 키, 뉴스 API 등록 필요), NOTION_TOKEN
# Variables(선택): G0_RSS_FEEDS (의료 전문지 RSS, 쉼표구분 — 약관 확인 후), NAVER_NEWS_ENDPOINT
#
# ⚠️ schedule 은 기본 브랜치(main)에서만 발동한다.

on:
  schedule:
    # 정각(UTC 01:00)은 GitHub 예약 실행이 몰려 10/21~26 매일 4시간 넘게 늦게 돌았다(14:12~14:34 KST).
    # 붐비지 않는 분(17분)으로, 지연돼도 출근 전에 끝나도록 07:17 KST에 예약한다.
    - cron: "17 22 * * *"      # 매일 07:17 KST (UTC 22:17 전날)
  workflow_dispatch:
    inputs:
      hours:
        description: "최근 몇 시간 기사를 볼지 (기본 26)"
        required: false
        default: "26"

permissions:
  contents: read

jobs:
  g0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r geo_pipeline/requirements.txt

      - name: G0 실행
        env:
          G0_SOURCES: naver_news,rss
          G0_WINDOW_HOURS: ${{ github.event.inputs.hours || '26' }}
          G0_RSS_FEEDS: ${{ vars.G0_RSS_FEEDS }}
          NAVER_API_MODE: ${{ vars.NAVER_API_MODE || 'hub' }}
          NAVER_NEWS_ENDPOINT: ${{ vars.NAVER_NEWS_ENDPOINT }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_G0_DB: ${{ vars.NOTION_G0_DB }}
        run: |
          if [ -z "$NAVER_CLIENT_ID" ] || [ -z "$NAVER_CLIENT_SECRET" ]; then
            echo "::error::NAVER_CLIENT_ID/SECRET 시크릿이 없습니다. sample 데이터로 결과를 만들지 않도록 중단합니다."
            exit 1
          fi
          PYTHONPATH=geo_pipeline python -m pipeline.cli g0 --notion | tee g0_log.txt
          grep "노션" g0_log.txt >> "$GITHUB_STEP_SUMMARY" || true
          cat geo_pipeline/out/g0_*_summary.md >> "$GITHUB_STEP_SUMMARY"
          ! grep -q "❌" g0_log.txt   # 노션에 못 올렸으면 실패로 표시 (아티팩트는 아래 단계에서 그대로 올림)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g0-${{ github.run_id }}
          path: geo_pipeline/out/
          retention-days: 30
