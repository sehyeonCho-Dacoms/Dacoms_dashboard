<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: Inter, -apple-system, sans-serif; margin: 0; padding: 16px; color: #1e293b; }
  h3 { margin: 0 0 4px; font-size: 14px; }
  p { margin: 0 0 12px; font-size: 12px; color: #64748b; line-height: 1.4; }
  textarea {
    width: 100%; height: 220px; box-sizing: border-box; resize: vertical;
    font-family: ui-monospace, Menlo, monospace; font-size: 11px;
    border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px;
  }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  button {
    flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer;
    font-weight: 600; font-size: 13px;
  }
  #create { background: #2563eb; color: #fff; }
  #cancel { background: #e2e8f0; color: #334155; }
  #status { margin-top: 10px; font-size: 12px; color: #2563eb; min-height: 16px; }
</style>
</head>
<body>
  <h3>카드뉴스 임포트</h3>
  <p>파이프라인 <code>export</code>로 만든 <code>figma_import.json</code> 내용을 붙여넣고 카드 프레임을 생성하세요.</p>
  <textarea id="json" placeholder='{ "brand": {...}, "cards": [...] }'></textarea>
  <div class="row">
    <button id="cancel">닫기</button>
    <button id="create">카드 생성</button>
  </div>
  <div id="status"></div>

<script>
  document.getElementById('create').onclick = () => {
    const raw = document.getElementById('json').value;
    const status = document.getElementById('status');
    let data;
    try {
      data = JSON.parse(raw);
    } catch (e) {
      status.style.color = '#dc2626';
      status.textContent = 'JSON 파싱 실패: ' + e.message;
      return;
    }
    status.style.color = '#2563eb';
    status.textContent = '생성 중...';
    parent.postMessage({ pluginMessage: { type: 'create', data } }, '*');
  };
  document.getElementById('cancel').onclick = () => {
    parent.postMessage({ pluginMessage: { type: 'cancel' } }, '*');
  };
  onmessage = (e) => {
    const msg = e.data.pluginMessage;
    if (msg && msg.type === 'done') {
      const s = document.getElementById('status');
      s.style.color = '#16a34a';
      s.textContent = msg.text;
    }
  };
</script>
</body>
</html>
